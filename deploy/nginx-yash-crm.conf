# /etc/nginx/sites-available/yash-crm
#
# Serves the built Vite SPA and proxies the API to gunicorn.
#
# No TLS here on purpose: Cloudflare terminates HTTPS at the edge and
# cloudflared delivers the request over the loopback interface, which never
# leaves the machine. Adding a certificate here would encrypt a connection to
# itself.
#
server {
    listen 127.0.0.1:80;
    server_name _;

    # Meta fetches invoice and receipt PDFs from a public URL at send time, and
    # some of them are several MB.
    client_max_body_size 32m;

    access_log /var/log/nginx/yash-crm.access.log;
    error_log  /var/log/nginx/yash-crm.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API + server-rendered admin -------------------------------------
    location ~ ^/(api|admin|auth|customers|invoices|payments|settings|static|portal|gateway|reports|staff) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # gunicorn.conf.py trusts this header; the app's ProxyFix reads it.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ---- Uploaded files ---------------------------------------------------
    location /uploads/ {
        alias /opt/yash-crm/instance/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Vite SPA ---------------------------------------------------------
    root /opt/yash-crm/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
