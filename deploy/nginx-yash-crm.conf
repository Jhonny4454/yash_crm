# OPTIONAL — the standard setup does not use nginx.
#
# cloudflared points straight at gunicorn (see cloudflared-config.yml). Flask
# serves its own /static and the Vite SPA at /app via blueprints/spa_bp.py, and
# Cloudflare does TLS, compression and caching at the edge. There is nothing
# left for a reverse proxy to do.
#
# Use this file only if you specifically want nginx in front — for example to
# host another site on the same box.
#
# NOTE ON THE ROUTING BELOW. An earlier draft of this file listed the Flask
# prefixes explicitly and served the SPA as the fallback. That is backwards for
# this app: it has 21 top-level route prefixes in app.py alone, so any prefix
# missing from the list gets swallowed by the SPA and returns a blank page
# instead of a 404 — the hardest kind of bug to spot, because it looks like a
# working deploy. Proxy everything; let Flask decide what exists.
#
server {
    listen 127.0.0.1:80;
    server_name _;

    client_max_body_size 32m;

    access_log /var/log/nginx/yash-crm.access.log;
    error_log  /var/log/nginx/yash-crm.error.log;

    # Static assets straight off disk. Everything Vite writes to /app/assets
    # carries a content hash, so it can never go stale.
    location /app/assets/ {
        alias /opt/yash-crm/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        alias /opt/yash-crm/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Everything else. No prefix list to fall out of date.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
