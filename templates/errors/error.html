<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ code }} - YASH Internet Services</title>
  <!-- Bootstrap 5 & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Same animated gradient as login page */
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1rem;
    }

    .error-card {
      backdrop-filter: blur(16px) saturate(180%);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), 
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
      text-align: center;
      color: #fff;
      margin: 1rem;
    }

    .error-card h1 {
      font-size: 5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .error-card .error-icon {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }

    .error-card .error-message {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.9);
    }

    .error-card .btn-home {
      background: linear-gradient(135deg, #764ba2, #667eea);
      border: none;
      border-radius: 50px;
      padding: 0.7rem 2rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(118, 75, 162, 0.4);
      display: inline-block;
    }
    .error-card .btn-home:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 32px rgba(118, 75, 162, 0.6);
      color: #fff;
    }

    .error-card .footer-text {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      margin-top: 2rem;
    }

    @media (max-width: 576px) {
      .error-card {
        padding: 1.5rem 1rem;
        border-radius: 24px;
      }
      .error-card h1 { font-size: 3.5rem; }
      .error-card .error-icon { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1>{{ code }}</h1>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn-home">
      <i class="fas fa-home me-2"></i>Go to Dashboard
    </a>
    <div class="footer-text">
      &copy; 2026 Sumedh. All rights reserved.
    </div>
  </div>

</body>
</html>
