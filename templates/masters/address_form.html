{% extends "base.html" %}
{% block title %}{{ 'Edit Address' if address else 'Add Address' }}{% endblock %}

{% block content %}
<style>
  .glass-form {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 24px;
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.04);
  }
  .glass-form label {
    font-weight: 600;
    color: #1a0f2e;
  }
  .glass-form .form-control {
    background: rgba(255,255,255,0.7);
    border: 2px solid rgba(118, 75, 162, 0.3);
    border-radius: 16px;
    padding: 0.8rem 1rem;
    transition: all 0.3s;
  }
  .glass-form .form-control:focus {
    background: rgba(255,255,255,0.9);
    border-color: #764ba2;
    box-shadow: 0 0 0 4px rgba(118,75,162,0.15);
  }
  .btn-submit {
    background: linear-gradient(135deg, #764ba2, #667eea);
    border: none;
    border-radius: 50px;
    padding: 0.8rem 2.5rem;
    color: #fff;
    font-weight: 600;
    transition: all 0.3s;
  }
  .btn-submit:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(118,75,162,0.4);
  }
</style>

<h4 class="mb-3">
  <i class="fas fa-address-card me-2 text-primary"></i>
  {{ 'Edit Address' if address else 'Add New Address' }}
</h4>

<div class="glass-form">
  <form method="POST" action="{{ url_for('address_edit', id=address.id) if address else url_for('address_add') }}">
    <!-- CSRF Token – REQUIRED for Flask-WTF protection -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Address Name</label>
        <input type="text" class="form-control" name="name" value="{{ address.name if address else '' }}" placeholder="e.g. Office, Warehouse" required>
      </div>
      <div class="col-md-12">
        <label class="form-label">Address Line 1</label>
        <input type="text" class="form-control" name="line1" value="{{ address.address_line.split(',')[0] if address and address.address_line else '' }}" placeholder="Street, building, flat" required>
      </div>
      <div class="col-md-12">
        <label class="form-label">Address Line 2</label>
        <input type="text" class="form-control" name="line2" value="{{ address.address_line.split(',')[1:]|join(',') if address and address.address_line and ',' in address.address_line else '' }}" placeholder="Landmark, area (optional)">
      </div>
      <div class="col-md-4">
        <label class="form-label">City</label>
        <input type="text" class="form-control" name="city" value="{{ address.city if address else '' }}" placeholder="City" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">State</label>
        <input type="text" class="form-control" name="state" value="{{ address.state if address else '' }}" placeholder="State" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Pincode</label>
        <input type="text" class="form-control" name="pincode" value="{{ address.pincode if address else '' }}" placeholder="Pincode" required>
      </div>
    </div>
    <div class="mt-4">
      <a href="{{ url_for('address_list') }}" class="btn btn-secondary rounded-pill px-4 me-2">Cancel</a>
      <button type="submit" class="btn-submit">{{ 'Update Address' if address else 'Save Address' }}</button>
    </div>
  </form>
</div>
{% endblock %}
