{% extends "base.html" %}
{% block page_title %}{{ 'Edit' if category else 'Add' }} Addon Category{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="card">
      <div class="card-header bg-white fw-semibold">{{ 'Edit' if category else 'New' }} Addon Invoice Category</div>
      <div class="card-body">
        <form method="POST" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Category Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" placeholder="e.g. Installation Charges, ONU, ONT, Shifting" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Default Price (&#8377;)</label>
            <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ category.default_price if category else '0' }}">
            <div class="form-text small">This price auto-fills when you pick this category on an addon invoice.</div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Description</label>
            <input type="text" name="description" class="form-control" value="{{ category.description if category else '' }}" placeholder="Optional note">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Save</button>
            <a href="{{ url_for('addon_category_list') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
