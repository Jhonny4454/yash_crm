{% extends "base.html" %}
{% block title %}HR & Payroll{% endblock %}

{% block content %}
<style>
  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:6px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .panel-head { background:#1a76b8; color:#fff; padding:12px 18px; font-weight:600; font-size:.95rem;
                display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .panel-head .btn { --bs-btn-color:#1a76b8; }
  .tbl { width:100%; font-size:.85rem; border-collapse:collapse; }
  .tbl th { background:#f8fafc; color:#243447; font-weight:600; padding:11px 12px; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
  .tbl td { padding:10px 12px; border-bottom:1px solid #f1f5f9; color:#334155; vertical-align:middle; }
  .tbl tbody tr:hover { background:#f8fafc; }
  .tbl a { color:#1a76b8; text-decoration:none; }
  .tbl a:hover { text-decoration:underline; }
  .empty { text-align:center; color:#94a3b8; padding:30px 0; }
  .form-card { background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:24px; max-width:720px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .tile { display:block; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:22px; text-decoration:none;
          color:#243447; transition:.15s; height:100%; }
  .tile:hover { border-color:#1a76b8; box-shadow:0 4px 12px rgba(26,118,184,.12); transform:translateY(-2px); color:#1a76b8; }
  .tile i { font-size:1.6rem; color:#1a76b8; margin-bottom:10px; display:block; }
  .tile h6 { font-weight:700; margin-bottom:4px; font-size:.95rem; }
  .tile p { font-size:.8rem; color:#64748b; margin:0; }
</style><h3 class="fw-bold mb-4" style="color:#243447;">HR &amp; Payroll</h3>
<div class="row g-3">
  <div class="col-md-4"><a class="tile" href="{{ url_for('attendance_list') }}"><i class="fas fa-calendar-check"></i><h6>Attendance</h6><p>Daily present, absent and half-day records.</p></a></div>
  <div class="col-md-4"><a class="tile" href="{{ url_for('leave_list') }}"><i class="fas fa-plane-departure"></i><h6>Leaves</h6><p>Requests waiting for approval.</p></a></div>
  <div class="col-md-4"><a class="tile" href="{{ url_for('payroll_list') }}"><i class="fas fa-wallet"></i><h6>Payroll</h6><p>Monthly salary runs and payment status.</p></a></div>
</div>
{% endblock %}
