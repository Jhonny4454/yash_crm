# Render blueprint: the Flask API and the React front end as two services.
#
# The database is NOT defined here - it lives on Railway, and Render reaches it
# over the public connection string. Railway hands you a URL beginning
# `mysql://`; config.py rewrites that to `mysql+pymysql://` because SQLAlchemy 2
# will not accept the bare prefix.
#
# Deploy: push this file, then in Render choose New > Blueprint and point it at
# the repository. Every value marked `sync: false` must be filled in by hand in
# the dashboard - they are secrets and do not belong in the repository.
#
#   render.com  ->  Blueprint  ->  connect repo  ->  fill the secrets
#
# After the first deploy, run the schema upgrade once from the API service's
# Shell tab:
#
#   python upgrade_schema.py

services:
  # ----------------------------------------------------------------- API ----
  - type: web
    name: yash-crm-api
    runtime: python
    plan: starter
    region: singapore          # closest Render region to Navi Mumbai
    branch: main
    buildCommand: pip install -r requirements.txt
    # Reads gunicorn.conf.py rather than repeating its settings on the command
    # line. That file says, in capitals, KEEP WORKERS AT 1 - APScheduler runs
    # inside the Flask process, so a second worker is a second scheduler, and
    # every nightly job fires twice: two auto-invoices per customer, two
    # "your plan expires" WhatsApp messages, two suspension sweeps.
    #
    # This command line said `--workers 2`, and a command-line flag overrides
    # the config file, so the guard in gunicorn.conf.py was being silently
    # ignored on every deploy. Throughput comes back through threads instead
    # (WEB_THREADS below): these requests are almost entirely waiting on a
    # database in another datacentre, which is exactly what threads are for.
    startCommand: gunicorn -c gunicorn.conf.py wsgi:application
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"   # matches runtime.txt
      - key: FLASK_ENV
        value: production

      # Render containers run in UTC. Every "today" in this app - the
      # dashboard's seven-day cycle, plan expiry, collected-today - is a
      # business day in Navi Mumbai, and between midnight and 05:30 IST the
      # UTC date is still yesterday. The API pins its own date arithmetic to
      # Asia/Kolkata regardless; this makes the process clock, the scheduler's
      # cron times and the logs agree with it.
      - key: TZ
        value: Asia/Kolkata

      # One process (see startCommand), several threads. Each request spends
      # most of its life waiting on Railway, so threads are nearly free here
      # and 8 of them fit the 512 MB starter plan comfortably.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_THREADS
        value: "8"

      # Railway's MySQL connection string, e.g.
      #   mysql://root:pass@containers-us-west-1.railway.app:6543/railway
      - key: DATABASE_URL
        sync: false

      # python -c "import secrets; print(secrets.token_hex(32))"
      # Two different values. harden() refuses to boot without them.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # The front end's own origin. Without this every API call from the
      # deployed UI is blocked by the browser's cross-origin check.
      - key: CORS_ORIGINS
        value: https://yash-internet-services.onrender.com

      # The address a CUSTOMER'S PHONE reaches this API on.
      #
      # The bill and receipt WhatsApp templates carry the PDF as a document
      # header, and Meta fetches that file itself from a public link - so the
      # link has to be built from a public https address, not from whatever
      # host the request happened to arrive on. Behind Render's proxy that
      # would often be an internal address, and the bill would go out with no
      # attachment and no error.
      #
      # Must match this service's own public URL.
      - key: PUBLIC_BASE_URL
        value: https://yash-internet-services.onrender.com

      # Session policy. This is the number that actually bounds how long an
      # access token that left the machine stays usable - not the browser's
      # idle timer, which only clears localStorage on the machine it runs on.
      # The client refreshes silently, so a short access token is invisible to
      # the operator.
      #
      # The browser's own idle sign-out is 30 minutes (frontend/src/session/
      # idle.js). It was 2, which signed people out mid-phone-call and is the
      # loudest reason the login flow felt broken. Override per deployment
      # with VITE_IDLE_MINUTES on the static service if a site wants tighter.
      - key: JWT_ACCESS_MINUTES
        value: "15"

      - key: SLOW_REQUEST_MS
        value: "1500"
      - key: LOGIN_MAX_ATTEMPTS
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "16"

      # Optional integrations - leave blank until they are set up.
      - key: WA_ENABLED
        value: "0"
      - key: WA_API_URL
        sync: false
      - key: WA_API_TOKEN
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false

    # Uploaded KYC documents and invoice logos must survive a redeploy.
    # Without this disk they are wiped on every push.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1

  # ------------------------------------------------------------ front end ---
  - type: web
    name: yash-crm
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      # Absolute API base, because the two services are on different hosts.
      - key: VITE_API_URL
        value: https://yash-internet-services.onrender.com/api/v1
      # The static site is published at this service's root. The local Flask
      # bundle uses /app/ by default; overriding it here keeps generated asset
      # URLs and React Router paths on the static service root.
      - key: VITE_BASE_PATH
        value: /
    routes:
      # React Router owns the paths; hand every unknown one to index.html or a
      # refresh on /app/customers returns 404 from the CDN.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Hashed asset filenames, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
