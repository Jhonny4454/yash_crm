# Render blueprint: the Flask API and the React front end as two services.
#
# The database is NOT defined here - it lives on Railway, and Render reaches it
# over the public connection string. Railway hands you a URL beginning
# `mysql://`; config.py rewrites that to `mysql+pymysql://` because SQLAlchemy 2
# will not accept the bare prefix.
#
# Deploy: push this file, then in Render choose New > Blueprint and point it at
# the repository. Every value marked `sync: false` must be filled in by hand in
# the dashboard - they are secrets and do not belong in the repository.
#
#   render.com  ->  Blueprint  ->  connect repo  ->  fill the secrets
#
# After the first deploy, run the schema upgrade once from the API service's
# Shell tab:
#
#   python upgrade_schema.py

services:
  # ----------------------------------------------------------------- API ----
  - type: web
    name: yash-crm-api
    runtime: python
    plan: starter
    region: singapore          # closest Render region to Navi Mumbai
    branch: main
    buildCommand: pip install -r requirements.txt
    # 2 workers on the starter plan; more will thrash the 512 MB limit.
    # --timeout 120 because the PDF and bulk-billing endpoints are slow.
    startCommand: gunicorn wsgi:application --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"   # matches runtime.txt
      - key: FLASK_ENV
        value: production

      # Railway's MySQL connection string, e.g.
      #   mysql://root:pass@containers-us-west-1.railway.app:6543/railway
      - key: DATABASE_URL
        sync: false

      # python -c "import secrets; print(secrets.token_hex(32))"
      # Two different values. harden() refuses to boot without them.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # The front end's own origin. Without this every API call from the
      # deployed UI is blocked by the browser's cross-origin check.
      - key: CORS_ORIGINS
        value: https://yash-crm.onrender.com

      # The address a CUSTOMER'S PHONE reaches this API on.
      #
      # The bill and receipt WhatsApp templates carry the PDF as a document
      # header, and Meta fetches that file itself from a public link - so the
      # link has to be built from a public https address, not from whatever
      # host the request happened to arrive on. Behind Render's proxy that
      # would often be an internal address, and the bill would go out with no
      # attachment and no error.
      #
      # Must match this service's own public URL.
      - key: PUBLIC_BASE_URL
        value: https://yash-crm-api.onrender.com

      # Session policy. The browser signs itself out after 2 minutes with no
      # activity on the page; this bounds how long an access token that left
      # the machine stays usable. The client refreshes silently, so shortening
      # it is invisible to the operator.
      - key: JWT_ACCESS_MINUTES
        value: "15"

      - key: SLOW_REQUEST_MS
        value: "1500"
      - key: LOGIN_MAX_ATTEMPTS
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "16"

      # Optional integrations - leave blank until they are set up.
      - key: WA_ENABLED
        value: "0"
      - key: WA_API_URL
        sync: false
      - key: WA_API_TOKEN
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false

    # Uploaded KYC documents and invoice logos must survive a redeploy.
    # Without this disk they are wiped on every push.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1

  # ------------------------------------------------------------ front end ---
  - type: web
    name: yash-crm
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      # Absolute API base, because the two services are on different hosts.
      - key: VITE_API_URL
        value: https://yash-crm-api.onrender.com/api/v1
      # The static site is published at this service's root. The local Flask
      # bundle uses /app/ by default; overriding it here keeps generated asset
      # URLs and React Router paths on the static service root.
      - key: VITE_BASE_PATH
        value: /
    routes:
      # React Router owns the paths; hand every unknown one to index.html or a
      # refresh on /app/customers returns 404 from the CDN.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Hashed asset filenames, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
